name: WeMine QA Automation Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Running automated regression tests every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Environment to run tests against'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - dev

jobs:
  test-execution:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      NODE_ENV: ${{ inputs.test_env || 'staging' }}
      API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
      TEST_AUTH_TOKEN: ${{ secrets.TEST_AUTH_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps

      - name: Execute Playwright Test Suite
        run: npx playwright test

      - name: Upload HTML Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
